<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDTRIX - Dynamic Grand Unified Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero">
    <div class="wrap">
      <div class="top-badge" id="hero-badge">Loading...</div>
      <h1 id="hero-title">Loading Subject...</h1>
      <div class="telemetry-stats" id="telemetry">
        <!-- Stats populated dynamically -->
      </div>
    </div>
  </header>

  <!-- Interactive SVG Network -->
  <section id="network-section">
    <div class="wrap">
      <h2>Grand Unified Map</h2>
      <div class="network-container" id="network-container">
        <!-- SVG injected here -->
      </div>
    </div>
  </section>

  <!-- Mechanism Pillar Cards Grid -->
  <section id="pillars-section">
    <div class="wrap">
      <h2>Pillars of Mechanism</h2>
      <div class="pillars-grid" id="pillars-grid">
        <!-- Cards populated dynamically -->
      </div>
    </div>
  </section>

  <!-- Cross-Pillar Connections Table -->
  <section id="cross-pillar-section">
    <div class="wrap">
      <h2>Cross-Pillar Integration & CBME Matrix</h2>
      <div class="cross-pillar-table-wrapper">
        <table class="cross-pillar-table">
          <thead>
            <tr>
              <th>Competency</th>
              <th>CBME Code</th>
              <th>Pillars</th>
              <th>Verification</th>
            </tr>
          </thead>
          <tbody id="cross-pillar-body">
            <!-- Rows populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Integration Case Chains -->
  <section id="cases-section">
    <div class="wrap">
      <h2>Clinical Integration Chains</h2>
      <div class="cases-grid" id="cases-grid">
        <!-- Chains populated dynamically -->
      </div>
    </div>
  </section>

  <!-- Drug/Intervention Map -->
  <section id="rx-section">
    <div class="wrap">
      <h2>Intervention Map</h2>
      <div class="rx-grid" id="rx-grid">
        <!-- Interventions populated dynamically -->
      </div>
    </div>
  </section>

  <!-- Speed Reference / Operating Rules -->
  <section id="speed-section">
    <div class="wrap">
      <h2>Speed Reference & Operating Rules</h2>
      <div class="speed-grid" id="speed-grid">
        <!-- Cards populated dynamically -->
      </div>
    </div>
  </section>

  <!-- Drawer / Quiz Overlay -->
  <div id="overlay" class="overlay">
    <div class="overlay-content">
      <button class="close-btn" id="close-overlay">&times;</button>
      <div id="overlay-body">
        <!-- Content injected here -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
